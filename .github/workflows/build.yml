name: build-deb

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'MEMORY/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build deb (macOS + Xcode toolchain -> real arm64e)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Setup Theos
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/makefiles" | head

      - name: Install ldid
        run: |
          set -euo pipefail
          brew install ldid dpkg xz 2>/dev/null || true
          which ldid || echo "ldid missing"

      - name: Bump version (auto build number)
        run: |
          set -euo pipefail
          BASE=$(grep -m1 '^Version:' control | sed 's/^Version:[[:space:]]*//' | sed 's/+build\..*$//')
          NEW="${BASE}+build.${{ github.run_number }}"
          echo "VERSION=$NEW" >> "$GITHUB_ENV"
          echo "version -> $NEW"
          sed -i '' "s/^Version:.*/Version: $NEW/" control
          if [ -f layout/DEBIAN/control ]; then
            sed -i '' "s/^Version:.*/Version: $NEW/" layout/DEBIAN/control
          fi
          grep -m1 '^Version:' control

      - name: Build PetDFYPrefs from source
        continue-on-error: true
        run: |
          bash tools/build-prefs.sh 2>&1 | tee prefs.log || echo "prefs 源码编译失败，回退 vendor 二进制"

      - name: Build layout (picks up source-built prefs)
        run: |
          set -o pipefail
          bash tools/build-layout.sh 2>&1 | tee layout.log

      - name: Build dylibs + package
        run: |
          set -o pipefail
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make clean 2>&1 | tail -5 || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tee build.log

      - name: Verify deb (arch must be arm64e)
        run: |
          set -euo pipefail
          DEB=$(ls -1 packages/*.deb | head -1)
          echo "DEB: $DEB"
          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP" 2>/dev/null || (cd "$TMP" && ar x "$OLDPWD/$DEB" && tar -xf data.tar.*)
          python3 - "$TMP" <<'PY'
          import os, struct, sys
          root = sys.argv[1]
          ok = True
          for dp, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(dp, f)
                  if not (f.endswith(".dylib") or f == "PetDFYPrefs"):
                      continue
                  d = open(p, "rb").read(32)
                  if len(d) < 32 or struct.unpack_from("<I", d, 0)[0] != 0xFEEDFACF:
                      continue
                  ct, cs = struct.unpack_from("<II", d, 4)
                  tag = "arm64e" if cs == 0x80000002 else f"cs={hex(cs)}"
                  print(f"  {f:24s} {tag}")
                  if cs != 0x80000002:
                      ok = False
          if not ok:
              print("FAIL: 存在非 arm64e 切片")
              sys.exit(1)
          print("ARCH OK")
          PY
          bash tools/verify-deb.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: PetDFY-deb-${{ env.VERSION }}
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            layout.log
            prefs.log
          if-no-files-found: ignore